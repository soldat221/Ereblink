spring:
  datasource:
    url: jdbc:h2:mem:ereblink;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

app:
  jwt:
    issuer: "fileshare-test"
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_TEST_ONLY"
    accessTokenMinutes: 60
